name: Keep osint warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping osint health endpoint
        run: |
          curl -sS -o /dev/null -w "osint /health -> HTTP %{http_code} in %{time_total}s\n" \
            --max-time 30 \
            "https://osint.internalservices.api.lemtik.com.ng/health"
